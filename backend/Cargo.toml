[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/payments",
    "crates/evm",
    "crates/auth",
    "crates/merchants",
    "crates/storage",
    "crates/settlement",
    "crates/integration_client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# async runtime / web
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = { version = "0.8", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# serialization / schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["uuid", "chrono"] }

# evm
alloy-primitives = { version = "1", features = ["serde"] }
alloy-sol-types = "1"
# Alloy 1.6.x is the last line with MSRV 1.88 (2.x needs rustc 1.94). Pinned exactly.
alloy = { version = "=1.6.3", default-features = false, features = [
    "std", "consensus", "network", "providers", "provider-http", "rpc-types", "signers", "signer-local", "reqwest-rustls-tls", "sol-types",
] }
alloy-node-bindings = "=1.6.3"
# Sub-crates pinned to the same line so the resolver cannot mix in 1.8.x (rustc 1.91).
alloy-consensus = "=1.6.3"
alloy-eips = "=1.6.3"
alloy-genesis = "=1.6.3"
alloy-json-rpc = "=1.6.3"
alloy-network = "=1.6.3"
alloy-network-primitives = "=1.6.3"
alloy-rpc-types-eth = "=1.6.3"
alloy-serde = "=1.6.3"
alloy-signer = "=1.6.3"

# db
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }

# misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
subtle = "2"

# tests
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# Floats are forbidden for money; this lint helps catch accidental casts.
cast_precision_loss = "deny"
