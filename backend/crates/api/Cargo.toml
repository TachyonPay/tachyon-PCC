[package]
name = "pcc-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Rust API server (Axum): health, gate status, merchant/payment endpoints (M6)"

[[bin]]
name = "pcc-api"
path = "src/main.rs"

[[bin]]
name = "export-public-openapi"
path = "src/bin/export_public_openapi.rs"

[lib]
name = "pcc_api"
path = "src/lib.rs"

[features]
default = []
# Enables dev-only mock adapters. Never enable for deployed builds.
dev-mock = ["pcc-payments/mock"]

[dependencies]
pcc-payments = { path = "../payments" }
pcc-integration-client = { path = "../integration_client" }
pcc-auth = { path = "../auth" }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
