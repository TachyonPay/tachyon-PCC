[package]
name = "pcc-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Rust API server (Axum): health, gate status, merchant/payment endpoints (M6)"
default-run = "pcc-api"

[[bin]]
name = "pcc-api"
path = "src/main.rs"

[[bin]]
name = "export-public-openapi"
path = "src/bin/export_public_openapi.rs"

[lib]
name = "pcc_api"
path = "src/lib.rs"

[features]
default = []
# Enables dev-only mock adapters. Never enable for deployed builds.
dev-mock = ["pcc-payments/mock"]

[dependencies]
pcc-payments = { path = "../payments" }
pcc-integration-client = { path = "../integration_client" }
pcc-auth = { path = "../auth" }
pcc-merchants = { path = "../merchants" }
pcc-settlement = { path = "../settlement" }
axum.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["trace", "timeout", "cors"] }
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
hex.workspace = true
sha2.workspace = true
alloy-primitives.workspace = true
reqwest.workspace = true
rand.workspace = true
async-trait.workspace = true

[dev-dependencies]
pcc-payments = { path = "../payments", features = ["mock"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
alloy.workspace = true
wiremock.workspace = true

[lints]
workspace = true
